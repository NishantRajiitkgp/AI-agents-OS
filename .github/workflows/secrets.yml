name: secrets

# Contract at every tier, prototypes included (06 §3). Prototype repositories become real
# repositories with their history intact, so "it was only a prototype" removes nothing from
# the log.
#
# `fetch-depth: 0` is what makes the history half possible, and the history half is the point.
# A secret deleted in a later commit is still readable at the commit that added it, to anyone
# who can clone. A scan of the current tree alone would report clean on a repository whose
# history is compromised, which is the most dangerous shape of false negative: indistinguishable
# from real safety.
#
# PROVISIONAL IMPLEMENTATION, per ADR-006. Moves into `aios check` at M1-14.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: No credentials in the tree or the history
        run: python3 .github/scripts/scan-secrets.py --all
